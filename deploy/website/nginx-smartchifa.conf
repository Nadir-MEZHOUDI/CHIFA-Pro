# /etc/nginx/sites-available/smartchifa.conf — SmartCHIFA landing page (same Cloudflare origin certificate as chifa-gateway.conf).
# Install:
#   sudo cp ~/nginx-smartchifa.conf /etc/nginx/sites-available/smartchifa.conf
#   sudo ln -s /etc/nginx/sites-available/smartchifa.conf /etc/nginx/sites-enabled/smartchifa.conf
#   sudo nginx -t && sudo systemctl reload nginx
# DNS: add `smartchifa` A 138.199.213.207 (proxied) in Cloudflare for smartappdz.org.
#
# The files live in /var/www/smartapp/smartchifa (owned by nadir), so updating the page needs no sudo:
#   scp website/index.html vps:/var/www/smartapp/smartchifa/
#   scp website/assets/* vps:/var/www/smartapp/smartchifa/assets/

server {
    listen 80;
    listen [::]:80;
    server_name smartchifa.smartappdz.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartchifa.smartappdz.org;

    ssl_certificate /etc/ssl/certs/cloudflare-smartpharm.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-smartpharm.key;

    root /var/www/smartapp/smartchifa;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
