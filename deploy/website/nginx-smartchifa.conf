# /etc/nginx/sites-available/smartchifa.conf — SmartCHIFA landing page (same Cloudflare origin certificate as chifa-gateway.conf).
# Install:
#   sudo cp ~/nginx-smartchifa.conf /etc/nginx/sites-available/smartchifa.conf
#   sudo ln -s /etc/nginx/sites-available/smartchifa.conf /etc/nginx/sites-enabled/smartchifa.conf
#   sudo nginx -t && sudo systemctl reload nginx
# DNS: add `smartchifa` A 138.199.213.207 (proxied) in Cloudflare for smartappdz.org.
#
# The files live in /var/www/smartapp/smartchifa (owned by nadir), so updating the page needs no sudo.
# ar/index.html is generated: run `node deploy/website/build-ar.mjs` after editing index.html or ar.json, then:
#   scp -r website/index.html website/ar website/robots.txt website/sitemap.xml vps:/var/www/smartapp/smartchifa/
#   scp -r website/assets vps:/var/www/smartapp/smartchifa/
# Assets are cached for 30 days: give a changed image a new file name.

server {
    listen 80;
    listen [::]:80;
    server_name smartchifa.smartappdz.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartchifa.smartappdz.org;

    ssl_certificate /etc/ssl/certs/cloudflare-smartpharm.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-smartpharm.key;

    root /var/www/smartapp/smartchifa;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # add_header in a location drops the server-level ones, so each location sets its own.
    location / {
        try_files $uri $uri/ =404;
        # "private" stops Cloudflare from turning no-cache into its 4-hour browser cache, so page edits show at once.
        add_header Cache-Control "private, no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
