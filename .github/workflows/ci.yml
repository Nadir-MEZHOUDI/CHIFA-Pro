name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "CHIFA Pro.sln"

      - name: Build (Release)
        run: dotnet build "CHIFA Pro.sln" -c Release --no-restore

      - name: Test (unit tests only)
        run: dotnet test "CHIFA.Tests/CHIFA.Tests.csproj" --filter "Category!=DbFunctional&Category!=Perf" -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*
          retention-days: 7
