trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  # Automatically increment the version number with each build

steps:
- task: DownloadSecureFile@1
  name: dxLicense
  displayName: 'Download DevExpress license file'
  inputs:
    secureFile: 'DevExpress_License.txt'

- task: PowerShell@2
  displayName: 'Install DevExpress license file'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $destDir = Join-Path $env:APPDATA 'DevExpress'
      New-Item -ItemType Directory -Force -Path $destDir | Out-Null
      $dest = Join-Path $destDir 'DevExpress_License.txt'
      Copy-Item '$(dxLicense.secureFilePath)' $dest -Force
      # Fingerprint only (never the key) to tell which license file the build actually got.
      $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.Substring(0, 12)
      Write-Host "DevExpress license file copied to $destDir ($((Get-Item $dest).Length) bytes, sha256 $hash...)"

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    command: 'restore'
    projects: '**/CHIFA.Pro.csproj'
    feedsToUse: 'select'
    vstsFeed: '1ed0d063-2001-4386-82a2-66c01ee046b2'

- task: DotNetCoreCLI@2
  displayName:  Publish App
  inputs:
    command: 'publish'
    publishWebProjects: false
    zipAfterPublish: false
    modifyOutputPath: false
    projects: '**/CHIFA.Pro.csproj'
    arguments: '-c Release --no-self-contained -r win-x64 -o $(Build.ArtifactStagingDirectory)/publish  --no-restore'

- task: DotNetCoreCLI@2
  displayName:  Install VPK
  inputs:
    command: 'custom'
    custom: 'tool'
    arguments: 'install --global vpk'

- task: PowerShell@2
  displayName: 'Extract File Version'
  inputs:
    targetType: 'inline'
    script: |
      $filePath = "$(Build.ArtifactStagingDirectory)/publish/CHIFA.Pro.exe"  
      if (Test-Path $filePath) {
        $fullVersion = (Get-Item $filePath).VersionInfo.FileVersion
           # Extract the first three parts (MAJOR.MINOR.PATCH)
          $versionParts = $fullVersion -split '\.'  # Split the version string by '.'
          $major = [int]$versionParts[0]
          $minor = [int]$versionParts[1]
          $patch = [int]$versionParts[2]
          $shortVersion = "$major.$minor.$patch"  # Construct the new version string
          Write-Host "FileVersion: $shortVersion"
          Write-Output "##vso[task.setvariable variable=FileVersion]$shortVersion"
         } else {
           Write-Error "File not found: $filePath"
         } 

- task: PowerShell@2
  displayName: 'Download Update with VPK'
  inputs:
    targetType: 'inline'
    script: |
      $url = "https://nadirsmartapp.blob.core.windows.net/chifa-pro"
      vpk download http --url $url -o $(Build.ArtifactStagingDirectory)/Releases

- task: PowerShell@2
  displayName: Pack App using VPK
  inputs:
    targetType: 'inline'
    script: 'vpk pack -u CHIFA.Pro -v $(FileVersion) -p $(Build.ArtifactStagingDirectory)/publish --icon $(Build.ArtifactStagingDirectory)/publish/icon.ico  -e CHIFA.Pro.exe --outputDir $(Build.ArtifactStagingDirectory)/Releases --packTitle SmartCHIFA'

# vpk download only fetches the latest release, so the uploaded feed listed one delta and any PC that
# missed a build re-downloaded the ~90 MB full package. Keep the older deltas (still in the container)
# in the feed so Velopack can chain them; it falls back to the full package if the chain is broken.
- task: PowerShell@2
  displayName: 'Keep delta history in the feed'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $url = "https://nadirsmartapp.blob.core.windows.net/chifa-pro"
      $feedPath = "$(Build.ArtifactStagingDirectory)/Releases/releases.win.json"
      $maxOlderDeltas = 9  # Velopack's MaximumDeltasBeforeFallback defaults to 10, the new delta included

      $feed = Get-Content $feedPath -Raw | ConvertFrom-Json
      $newest = $feed.Assets | ForEach-Object { [version]$_.Version } | Sort-Object -Descending | Select-Object -First 1
      $inFeed = @($feed.Assets.FileName)

      $known = @{}
      try { (Invoke-RestMethod "$url/releases.win.json").Assets | Where-Object Type -eq 'Delta' | ForEach-Object { $known[$_.FileName] = $_ } }
      catch { Write-Warning "Remote feed unreadable: $_" }

      $listing = (Invoke-WebRequest "$url`?restype=container&comp=list&prefix=CHIFA.Pro-" -UseBasicParsing).Content
      $blobs = ([xml]$listing.TrimStart([char]0xFEFF)).EnumerationResults.Blobs.Blob.Name

      $older = $blobs |
        Where-Object { $_ -match '^CHIFA\.Pro-(\d+\.\d+\.\d+)-delta\.nupkg$' -and $_ -notin $inFeed } |
        ForEach-Object { [pscustomobject]@{ Name = $_; Version = [version]($_ -replace '^CHIFA\.Pro-(.+)-delta\.nupkg$', '$1') } } |
        Where-Object { $_.Version -lt $newest } |
        Sort-Object Version -Descending | Select-Object -First $maxOlderDeltas

      $extra = foreach ($d in $older) {
        if ($known.ContainsKey($d.Name)) { $known[$d.Name]; continue }
        $tmp = Join-Path ([IO.Path]::GetTempPath()) $d.Name
        Invoke-WebRequest "$url/$($d.Name)" -OutFile $tmp -UseBasicParsing
        [pscustomobject]@{
          PackageId = 'CHIFA.Pro'; Version = $d.Version.ToString(); Type = 'Delta'; FileName = $d.Name
          SHA1 = (Get-FileHash $tmp -Algorithm SHA1).Hash; SHA256 = (Get-FileHash $tmp -Algorithm SHA256).Hash
          Size = (Get-Item $tmp).Length
        }
        Remove-Item $tmp
      }

      $feed.Assets = @($feed.Assets) + @($extra)
      $feed | ConvertTo-Json -Depth 5 | Set-Content $feedPath
      Write-Host "Feed now lists $(@($feed.Assets).Count) assets, deltas: $((@($feed.Assets) | Where-Object Type -eq 'Delta').Version -join ', ')"


- task: PublishBuildArtifacts@1
  displayName: Publish Build Artifacts
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/Releases'
    ArtifactName: 'CHIFA.Pro'
    publishLocation: 'Container'

