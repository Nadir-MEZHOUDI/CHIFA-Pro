<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Connectez-vous à SmartCHIFA Mobile pour consulter les factures, les bordereaux, les rejets et les statistiques de votre pharmacie depuis votre téléphone." />
    <meta name="theme-color" content="#0b3b2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SmartCHIFA" />
    <title>SmartCHIFA</title>
    <base href="/" />
    <link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="maskable-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="maskable-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="offline" class="offline-screen" role="alertdialog" aria-modal="true" aria-labelledby="offline-title" aria-describedby="offline-text" hidden>
        <div class="offline-card">
            <div class="offline-art" aria-hidden="true">
                <span class="offline-ring"></span>
                <span class="offline-ring"></span>
                <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M10.6 5.1A15 15 0 0 1 22 8.8M5 12.5a10 10 0 0 1 4.3-2.3M14.8 10.4A10 10 0 0 1 19 12.5M8.5 16.1a5 5 0 0 1 7 0M12 20h.01M3 3l18 18" /></svg>
            </div>
            <h1 id="offline-title">Pas de connexion Internet</h1>
            <p id="offline-text">SmartCHIFA a besoin d'Internet pour afficher les données de votre pharmacie. Activez les données mobiles ou connectez-vous à un réseau Wi-Fi.</p>
            <ul class="offline-tips">
                <li><svg viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0M12 20h.01M2 8.8a15 15 0 0 1 20 0" /></svg>Wi-Fi ou données mobiles activés</li>
                <li><svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" /></svg>Mode avion désactivé</li>
            </ul>
            <button type="button" class="button wide offline-retry">Réessayer</button>
            <span class="offline-status" aria-live="polite"></span>
        </div>
    </div>

    <div id="blazor-error-ui">
        Une erreur est survenue.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (() => {
            // beforeinstallprompt may fire before Blazor boots, so it is captured here and replayed to .NET.
            let deferred = null, listener = null;
            const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
            const ios = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const state = () => standalone() ? 'none' : deferred ? 'prompt' : ios() ? 'ios' : 'none';
            const notify = () => listener?.invokeMethodAsync('OnInstallStateChanged', state());
            addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; notify(); });
            addEventListener('appinstalled', () => { deferred = null; notify(); });

            const fromBase64Url = (value) => {
                const base64 = (value + '='.repeat((4 - value.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
                return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
            };
            const toInfo = (subscription) => {
                if (!subscription) return null;
                const json = subscription.toJSON();
                return { endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth };
            };
            const registration = () => navigator.serviceWorker.ready;
            const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

            window.chifa = {
                userAgent: () => navigator.userAgent,
                confirm: (text) => window.confirm(text),
                push: {
                    state: async () => {
                        if (!pushSupported()) return ios() && !standalone() ? 'ios-install' : 'unsupported';
                        if (Notification.permission === 'denied') return 'denied';
                        const subscription = await (await registration()).pushManager.getSubscription();
                        return subscription && Notification.permission === 'granted' ? 'on' : 'off';
                    },
                    subscribe: async (publicKey) => {
                        if (await Notification.requestPermission() !== 'granted') return null;
                        const manager = (await registration()).pushManager;
                        const key = fromBase64Url(publicKey);
                        let subscription = await manager.getSubscription();
                        // A subscription made with another server key cannot be reused.
                        const current = subscription?.options?.applicationServerKey;
                        if (subscription && current && new Uint8Array(current).toString() !== key.toString()) {
                            await subscription.unsubscribe();
                            subscription = null;
                        }
                        subscription ??= await manager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
                        return toInfo(subscription);
                    },
                    current: async () => pushSupported() ? toInfo(await (await registration()).pushManager.getSubscription()) : null,
                    unsubscribe: async () => {
                        if (!pushSupported()) return null;
                        const subscription = await (await registration()).pushManager.getSubscription();
                        if (!subscription) return null;
                        const endpoint = subscription.endpoint;
                        await subscription.unsubscribe();
                        return endpoint;
                    },
                    // On logout the server already drops this phone's subscriptions; the browser forgets its own.
                    forget: async () => {
                        try { await window.chifa.push.unsubscribe(); } catch { }
                    }
                },
                install: {
                    watch: (ref) => { listener = ref; return state(); },
                    unwatch: () => { listener = null; },
                    run: async () => {
                        if (deferred) {
                            const prompt = deferred;
                            deferred = null;
                            await prompt.prompt();
                            await prompt.userChoice;
                            notify();
                        } else if (ios()) {
                            alert("Pour installer SmartCHIFA : touchez le bouton Partager, puis « Sur l'écran d'accueil ».");
                        }
                    }
                }
            };
        })();
    </script>
    <script>
        // Reads the QR code shown in SmartCHIFA, menu « Application mobile ». The camera's own BarcodeDetector
        // where it exists (Android), jsQR otherwise (iPhone), loaded only then.
        window.chifa.scanner = (() => {
            let session = 0, stream = null, timer = 0;

            const loadJsQr = () => window.jsQR ? Promise.resolve() : new Promise((ok, fail) =>
                document.head.appendChild(Object.assign(document.createElement('script'), { src: 'lib/jsQR.js', onload: ok, onerror: fail })));

            const reader = async (video) => {
                if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) {
                    const detector = new BarcodeDetector({ formats: ['qr_code'] });
                    return async () => (await detector.detect(video))[0]?.rawValue;
                }
                await loadJsQr();
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d', { willReadFrequently: true });
                return async () => {
                    const scale = Math.min(1, 720 / Math.max(video.videoWidth, video.videoHeight));
                    const width = canvas.width = Math.round(video.videoWidth * scale);
                    const height = canvas.height = Math.round(video.videoHeight * scale);
                    if (!width || !height) return null;
                    context.drawImage(video, 0, 0, width, height);
                    return jsQR(context.getImageData(0, 0, width, height).data, width, height, { inversionAttempts: 'dontInvert' })?.data;
                };
            };

            const stop = () => {
                session++;
                clearTimeout(timer);
                stream?.getTracks().forEach(track => track.stop());
                stream = null;
            };

            // Returns 'ok', 'denied' (camera refused) or 'unavailable'. Each value read goes to OnScanned
            // until it answers true.
            const start = async (video, ref) => {
                stop();
                const current = session;
                if (!navigator.mediaDevices?.getUserMedia) return 'unavailable';
                let read;
                try { read = await reader(video); } catch { return 'unavailable'; }
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                } catch (e) {
                    return e.name === 'NotAllowedError' || e.name === 'SecurityError' ? 'denied' : 'unavailable';
                }
                if (current !== session) { stream.getTracks().forEach(track => track.stop()); return 'ok'; }

                video.srcObject = stream;
                await video.play().catch(() => { });
                const tick = async () => {
                    if (current !== session) return;
                    let value = null;
                    try { if (video.readyState >= 2) value = await read(); } catch { }
                    if (current !== session) return;
                    if (value && await ref.invokeMethodAsync('OnScanned', value)) { stop(); return; }
                    timer = setTimeout(tick, 180);
                };
                tick();
                return 'ok';
            };

            return { start, stop };
        })();
    </script>
    <script>
        (() => {
            const screen = document.getElementById('offline');
            const retry = screen.querySelector('.offline-retry');
            const status = screen.querySelector('.offline-status');
            const show = () => { status.textContent = ''; screen.hidden = false; };
            const hide = () => { screen.hidden = true; };
            addEventListener('offline', show);
            addEventListener('online', hide);
            if (!navigator.onLine) show();

            // navigator.onLine only knows about the radio, so the button checks that the network really answers.
            retry.onclick = async () => {
                retry.disabled = true;
                status.textContent = 'Vérification…';
                try {
                    await fetch(`manifest.webmanifest?ping=${Date.now()}`, { cache: 'no-store' });
                    hide();
                } catch {
                    status.textContent = 'Toujours hors ligne. Vérifiez votre connexion.';
                    screen.querySelector('.offline-card').animate(
                        [{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }],
                        { duration: 300 });
                } finally {
                    retry.disabled = false;
                }
            };
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        (async () => {
            if (!('serviceWorker' in navigator)) return;
            const sw = navigator.serviceWorker;
            const openedAt = Date.now();
            let pending = null, applied = false, banner = null;

            // Reload only after this page asked a new version to take over, so a first install or a reload can never loop.
            sw.addEventListener('controllerchange', () => { if (applied) location.reload(); });

            const apply = () => {
                if (!pending || applied) return;
                applied = true;
                pending.postMessage({ type: 'SKIP_WAITING' });
            };
            const editing = () => document.activeElement?.matches('input, textarea, select') ?? false;
            // While the pharmacist is typing, the update waits for their tap (or the next start of the app).
            const show = () => {
                banner ??= Object.assign(document.body.appendChild(document.createElement('div')), { className: 'update-banner', role: 'status' });
                if (editing()) {
                    banner.innerHTML = '<span>Nouvelle version disponible</span><button type="button" class="button small">Mettre à jour</button>';
                    banner.querySelector('button').onclick = apply;
                } else {
                    banner.innerHTML = '<span>Nouvelle version disponible — mise à jour…</span>';
                    setTimeout(() => editing() ? show() : apply(), 2500);
                }
            };
            const offer = (worker) => {
                if (pending === worker) return;
                pending = worker;
                if (Date.now() - openedAt < 10000) apply();
                else show();
            };
            const watch = (registration) => {
                if (registration.waiting && sw.controller) offer(registration.waiting);
                registration.addEventListener('updatefound', () => {
                    const worker = registration.installing;
                    worker?.addEventListener('statechange', () => {
                        if (worker.state === 'installed' && sw.controller) offer(worker);
                    });
                });
            };

            const registration = await sw.register('service-worker.js', { updateViaCache: 'none' });
            watch(registration);
            const check = () => registration.update().catch(() => { });
            check();
            setInterval(check, 30 * 60 * 1000);
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
        })();
    </script>
</body>

</html>
