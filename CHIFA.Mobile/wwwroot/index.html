<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#0e7c66" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>SmartCHIFA</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
